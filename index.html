<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mimos Express</title>

  <!-- Configurações PWA / Mobile -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#d93838">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mimos Express">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="./icon-512.png">
  <link rel="icon" href="./icon-512.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #121212;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #121212;
    }
  </style>
</head>
<body>
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzA5jgH_wVpEC-VUtUOTWu-K_F_X2ZfXgAkW8gv7OvESVzXD55tDG3DieyXvUUc9k1m/exec"
    allow="clipboard-read; clipboard-write"
    loading="eager">
  </iframe>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").catch(function(err) {
          console.error("Falha ao registrar Service Worker:", err);
        });
      });
    }
  </script>
</body>
</html>
